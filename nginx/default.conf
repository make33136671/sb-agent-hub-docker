# ═══════════════════════════════════════════════════════════
#  赛博客服系统单容器 Nginx 配置（四端口分离，9000 段）
#  9000 → 访客聊天端 (chat-ui) + API 代理
#  9001 → 管理后台 (admin-ui) + API 代理
#  9002 → API 直通
#  9003 → Widget 挂件资源 + API 代理
# ═══════════════════════════════════════════════════════════

# 优先使用上游传来的 X-Forwarded-Proto（宿主机 Nginx 设置的真实协议），
# 没有时才使用当前连接的 $scheme（兼容直接访问容器端口的场景）
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ── 访客聊天端 9000 ──
server {
    listen 9000;
    root /app/chat-ui;
    index index.html;

    # /api/xxx → 原样转发（后端路由含 /api/ 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    location /upload/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 管理后台 9001 ──
server {
    listen 9001;
    root /app/admin-ui;
    index index.html;

    # 数据库备份导入允许上传大文件（nginx 默认仅 1MB）
    client_max_body_size 2048m;

    # /api/xxx → 原样转发（后端路由含 /api/ 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        # 备份导入需解包/重打包，放宽等待时间
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /upload/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── API 直通 9002 ──
server {
    listen 9002;
    client_max_body_size 2048m;

    location / {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 86400;
    }
}

# ── Widget 挂件 9003 ──
server {
    listen 9003;
    root /app/widget;
    index index.html;

    # /api/xxx → 原样转发（后端路由含 /api/ 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    location /upload/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    location /hubs/ {
        proxy_pass http://127.0.0.1:6010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
