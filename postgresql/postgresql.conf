# PostgreSQL 配置（单容器优化）

# 连接设置
listen_addresses = '*'
port = 5432
max_connections = 100

# 内存配置（根据容器大小调整）
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# WAL 设置
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# 日志
logging_collector = off
log_destination = stderr

# 时区
timezone = 'Asia/Shanghai'

# 客户端认证（由 pg_hba.conf 控制）
# 本地 trust，远程 md5
